# models/core/core_models.yml
version: 2

models:
  - name: core_daily_product_performance
    description: Daily aggregated product performance metrics.
    columns:
      - name: event_date
        description: The date of the aggregated metrics.
        tests:
          - not_null
          - unique
      - name: product_id
        description: Unique identifier for the product.
        tests:
          - not_null
      - name: total_units_sold
        description: Total units sold for the product on that day.
        tests:
          - not_null
          - dbt_utils.at_least_one:
              column_name: total_units_sold
              value: 0
          - dbt_utils.equal_to_or_greater_than:
              field: total_units_sold
              value: 0
      - name: total_revenue
        description: Total revenue generated by the product on that day.
        tests:
          - not_null
          - dbt_utils.at_least_one:
              column_name: total_revenue
              value: 0
          - dbt_utils.equal_to_or_greater_than:
              field: total_revenue
              value: 0
      - name: total_views
        description: Total views for the product on that day.
        tests:
          - not_null
          - dbt_utils.at_least_one:
              column_name: total_views
              value: 0
          - dbt_utils.equal_to_or_greater_than:
              field: total_views
              value: 0

  - name: core_daily_user_activity
    description: Daily aggregated user activity metrics.
    columns:
      - name: activity_date
        description: The date of the aggregated metrics.
        tests:
          - not_null
          - unique
      - name: user_id
        description: Unique identifier for the user.
        tests:
          - not_null
      - name: views_count
        description: Number of product views by the user on that day.
        tests:
          - not_null
          - dbt_utils.equal_to_or_greater_than:
              field: views_count
              value: 0
      - name: add_to_cart_count
        description: Number of add-to-cart events by the user on that day.
        tests:
          - not_null
          - dbt_utils.equal_to_or_greater_than:
              field: add_to_cart_count
              value: 0
      - name: purchase_count
        description: Number of purchase events by the user on that day.
        tests:
          - not_null
          - dbt_utils.equal_to_or_greater_than:
              field: purchase_count
              value: 0
      - name: distinct_products_interacted
        description: Number of distinct products the user interacted with.
        tests:
          - not_null
          - dbt_utils.equal_to_or_greater_than:
              field: distinct_products_interacted
              value: 0